<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniRAG Course Notes</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h1>📚 MiniRAG</h1>
                <p>Course Notes</p>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>
            <ul id="nav-links">
                <!-- Navigation links will be injected here dynamically -->
                <li class="loading-item">Loading chapters...</li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <button id="mobile-menu-btn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div id="content-container">
                <!-- Parsed markdown content will be injected here dynamically -->
            </div>
        </main>
    </div>

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js?v=4"></script>
</body>
</html>
